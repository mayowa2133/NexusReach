<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solomon — The people behind every job posting</title>
    <meta
      name="description"
      content="For every job you're targeting: the recruiter, the hiring manager, and a peer — with evidence for why they're right, a warm path from your own network, a safe email, and a drafted message. Nothing sends without you."
    />

    <!--
      Social share card. Referral links get pasted into LinkedIn, WhatsApp and
      DMs, so this preview is effectively the campaign's ad unit — a link with no
      card reads as untrustworthy exactly where trust decides the click.

      The card image is frontend/public/og-image.png (1200x630, the size LinkedIn
      and X expect). Swap it for custom art whenever you like.

      NOTE: update the absolute URLs below when the custom domain goes live —
      scrapers require absolute URLs, so these cannot be relative, and a stale
      host here means the card silently stops resolving.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solomon" />
    <meta property="og:url" content="https://nexusreach.vercel.app/" />
    <meta property="og:title" content="Solomon — The people behind every job posting" />
    <meta
      property="og:description"
      content="Every job posting has people behind it. Solomon finds the recruiter, the hiring manager, and a peer — with evidence, a warm path, a safe email, and a draft. You approve every send."
    />
    <meta property="og:image" content="https://nexusreach.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Solomon — find the recruiter, hiring manager, and peer behind any job posting."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solomon — The people behind every job posting" />
    <meta
      name="twitter:description"
      content="Every job posting has people behind it. Solomon finds the recruiter, the hiring manager, and a peer — with evidence, a warm path, a safe email, and a draft."
    />
    <meta name="twitter:image" content="https://nexusreach.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted (or system) theme before first paint to avoid a
      // light-mode flash. Kept in sync with src/stores/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('nexusreach-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
