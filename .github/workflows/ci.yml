name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    env:
      NEXUSREACH_ENVIRONMENT: test
      NEXUSREACH_AUTH_MODE: supabase
      NEXUSREACH_DEV_AUTH_BYPASS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Pin ruff: an unpinned `pip install ruff` auto-upgrades to the latest
          # release, which periodically enables new default rules and flags the
          # whole repo, breaking CI on unrelated PRs. Bump this deliberately.
          pip install ruff==0.15.6

      - name: Lint with ruff
        run: ruff check app tests conftest.py

      - name: Cross-category product quality gate
        run: python scripts/run_cross_category_eval.py

      - name: Run tests
        run: pytest -x -q

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      VITE_AUTH_MODE: supabase
      VITE_DEV_AUTH_BYPASS_ENABLED: "false"
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder-key"
      VITE_ANALYTICS_ENABLED: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "https://placeholder.api.com"

  extension-test:
    name: Companion Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # No bundler and no dependencies — the suite loads the real background.js
      # into a vm with stubbed chrome.*. Covers the auto-sync guards and the
      # message-authorization rules that keep page script away from the
      # companion token, so it needs to gate merges like everything else.
      - name: Run extension tests
        run: node --test "extension/tests/*.test.mjs"

      # The packager rewrites manifest origins and strips localhost; the message
      # rules are derived from that manifest at runtime, so a broken build would
      # silently widen who can talk to the worker.
      - name: Verify production packaging
        run: |
          NR_APP_ORIGIN=https://app.example.com \
          NR_API_ORIGIN=https://api.example.com \
          node extension/build.mjs
          node -e "
            const m = require('./extension/dist/prod/manifest.json');
            const all = JSON.stringify(m);
            if (all.includes('localhost') || all.includes('127.0.0.1')) {
              throw new Error('production manifest still references localhost');
            }
            const bridge = m.content_scripts.find(c => c.js.includes('app-bridge.js'));
            if (JSON.stringify(bridge.matches) !== JSON.stringify(['https://app.example.com/*'])) {
              throw new Error('app-bridge is not scoped to the app origin');
            }
          "

  e2e-real:
    name: Real Browser E2E
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexusreach_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexusreach_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXUSREACH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexusreach_e2e
      NEXUSREACH_REDIS_URL: redis://127.0.0.1:6379/1
      NEXUSREACH_SUPABASE_JWT_SECRET: nexusreach-e2e-supabase-jwt-secret
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run real E2E happy path
        working-directory: e2e
        run: npm run test:real
