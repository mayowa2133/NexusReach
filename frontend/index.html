<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solomon — Find the people behind your next opportunity</title>
    <meta
      name="description"
      content="Find relevant recruiters, likely team leads, and potential peers for the jobs you target — then start with a personalized outreach draft you can review."
    />

    <!--
      Social share card. Referral links get pasted into LinkedIn, WhatsApp and
      DMs, so this preview is effectively the campaign's ad unit — a link with no
      card reads as untrustworthy exactly where trust decides the click.

      The card image is frontend/public/og-image.png (1200x630, the size LinkedIn
      and X expect). Swap it for custom art whenever you like.

      Scrapers require absolute URLs, so these cannot be relative.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solomon" />
    <meta property="og:url" content="https://trysolomon.app/" />
    <meta property="og:title" content="Solomon — Find the people behind your next opportunity" />
    <meta
      property="og:description"
      content="Find relevant people for the jobs you target, understand why they fit, and start with an outreach draft you can review."
    />
    <meta property="og:image" content="https://trysolomon.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Solomon helps job seekers find relevant people and prepare better outreach."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solomon — Find the people behind your next opportunity" />
    <meta
      name="twitter:description"
      content="Find relevant people for the jobs you target, understand why they fit, and start with an outreach draft you can review."
    />
    <meta name="twitter:image" content="https://trysolomon.app/og-image.png" />

    <link rel="canonical" href="https://trysolomon.app/" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
